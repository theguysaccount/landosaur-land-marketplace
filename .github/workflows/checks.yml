# Weekly: live pages, files and sampled listings answer; every source was read within a week and is not failing;
# the indexing policy on the live site matches the configuration; the crawl is dispatched when it has stalled;
# official source links answer; the browser test passes on the live site.
name: Weekly checks

on:
  schedule:
    - cron: "11 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  # Fleet convention (~/code/DOMAIN_ROLLOUT.md): SITE_URL is the public address (LANDO_BASE_URL also works);
  # SITE_INDEXABLE is read back from the live build by scripts/health.py. See OPERATIONS.md.
  SITE_URL: ${{ vars.SITE_URL }}
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
  LANDO_BASE_URL: ${{ vars.SITE_URL || vars.LANDO_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  LANDO_REPO: ${{ github.repository }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Live health and staleness
        run: python scripts/health.py "$LANDO_BASE_URL"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Official source links answer
        run: python scripts/linkcheck.py "$LANDO_BASE_URL"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Browser test of the live site
        env:
          CI: "1"
        run: CHROME="$(command -v google-chrome)" node scripts/e2e.mjs "$LANDO_BASE_URL"

  keepalive:
    needs: [live, links, browser]
    if: always() && github.event_name == 'schedule'
    uses: ./.github/workflows/keepalive.yml
