# Manual-only live health check (scheduled cron disabled to avoid GitHub Actions costs).
# Run locally at $0 cost with: python3 scripts/health.py https://landosaur.com
name: Live checks (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANDO_BASE_URL: https://landosaur.com

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Live health and staleness
        run: python scripts/health.py "$LANDO_BASE_URL"
