# Manual-only CI (push/PR auto-triggers disabled to keep GitHub Actions cost at $0).
# Tests run locally inside ./scripts/publish.sh before every deploy.
name: CI (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build and guard
        run: |
          python -m lando.build dist
          python scripts/check_dist.py dist
      - name: Client scripts parse
        run: for f in api/xray.js api/listings.js api/offers.js api/search.js site/theme.js site/map.js site/listing.js site/xray.js site/list.js site/direct.js site/tables.js site/analyze.js scripts/e2e.mjs; do node --check "$f"; done
