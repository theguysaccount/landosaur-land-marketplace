# Daily: read every official source (robots-respecting, one request per second per host), merge, test, commit
# data/ and deploy. Safe to re-run at any time.
# Fails safe: a source that fails is retried, then kept on its last good data (a warning, recorded in
# data/sources.json); a failed test or guard stops before anything is committed or deployed.
name: Crawl and deploy

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests before
        run: python -m unittest discover -s tests -t .
      - name: Crawl the sources
        run: python -m lando.refresh --land-index
      - name: Tests and a full build on the new data
        run: |
          python -m unittest discover -s tests -t .
          python -m lando.build dist
          python scripts/check_dist.py dist
      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Crawl $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet origin main
          git push origin HEAD:main

  deploy:
    needs: crawl
    uses: ./.github/workflows/deploy.yml

  keepalive:
    needs: [crawl, deploy]
    if: always() && github.event_name == 'schedule'
    uses: ./.github/workflows/keepalive.yml
