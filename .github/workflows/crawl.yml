# Manual-only crawl workflow (scheduled cron disabled to avoid GitHub Actions costs).
# Run refreshes locally at $0 cost with: ./scripts/publish.sh --refresh
name: Crawl (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests before
        run: python -m unittest discover -s tests -t .
      - name: Crawl the sources
        run: python -m lando.refresh --land-index
      - name: Tests and build guard
        run: |
          python -m unittest discover -s tests -t .
          python -m lando.build dist
          python scripts/check_dist.py dist
      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Crawl $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
