# Manual-only GitHub Pages mirror deploy (auto push trigger disabled — production runs on Vercel via ./scripts/publish.sh).
name: GitHub Pages mirror (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  LANDO_BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  SITE_INDEXABLE: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python -m lando.build dist
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
